[package]
name = "patronus"
version.workspace = true
description = "Hardware bug-finding toolkit."
homepage = "https://kevinlaeufer.com"
keywords = ["RTL", "btor", "model-checking", "SMT", "bit-vector"]
edition.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
indexmap = "2.14.0"
codespan-reporting = "0.13.1"
lazy_static = "1.5.0"
smallvec = { version = "1.*", features = ["union"] }
rand.workspace = true
boolean_expression.workspace = true
regex.workspace = true
baa.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
fst-writer = "0.3.1"
cranelift = { version = "0.125.4", features = ["jit", "module"], optional = true}
inventory = {version = "0.3.20", optional = true}
fixedbitset = {version = "0.5.7", optional = true}
paste = {version = "1.0.15", optional = true}
cranelift-reader = {version = "0.125.4", optional = true}
walkdir = {version = "2.5.0", optional = true}
delegate = { version = "0.13.4", optional = true }

[features]
default = ["jit", "inline", "aot-clif"]
jit = ["dep:cranelift", "dep:inventory", "dep:fixedbitset", "dep:paste"]
aot-clif = ["dep:cranelift-reader", "dep:walkdir", "dep:delegate"]
inline = []

[dev-dependencies]
insta = { version = "1.*", features = ["yaml"] }

